<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="きょうのよてい">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>きょうのよてい</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">☀️ きょうのよてい</div>
        <h1 id="childGreeting">〇〇ちゃんのよてい</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
    </header>

    <main>
      <section id="emptyState" class="empty-state hidden">
        <div class="empty-emoji">🌱</div>
        <h2>きょうのよていをつくろう</h2>
        <p>いつもの予定からかんたんに作れます。</p>
        <button id="createFromEmptyBtn" class="primary-btn">予定をつくる</button>
      </section>

      <section id="scheduleSection">
        <div id="progressText" class="progress-text"></div>
        <div id="scheduleList" class="schedule-list"></div>
        <button id="finishBtn" class="finish-btn">おわった！</button>
        <button id="undoBtn" class="text-btn hidden">ひとつもどす</button>
        <div id="dayDone" class="day-done hidden">
          <div>🎉</div>
          <strong>きょうのよてい おしまい！</strong>
          <span>ぜんぶできたね。</span>
        </div>
      </section>
    </main>

    <nav class="parent-nav">
      <button id="editTodayBtn">✏️ 予定をなおす</button>
      <button id="resetTodayBtn">↻ 今日をリセット</button>
    </nav>
  </div>

  <div id="editorModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>今日の予定</h2>
        <button class="close-btn" data-close="editorModal">×</button>
      </div>
      <p class="hint">長押し・ドラッグで順番を変えられます。よく使う予定はタップで追加。</p>
      <div id="editorList" class="editor-list"></div>
      <div class="quick-add">
        <h3>よく使う予定</h3>
        <div id="favoriteButtons" class="chip-wrap"></div>
        <button id="newItemBtn" class="secondary-btn">＋ 新しい予定を作る</button>
      </div>
      <button id="saveScheduleBtn" class="primary-btn wide">今日の予定を保存</button>
    </div>
  </div>

  <div id="itemModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="itemModalTitle">予定を作る</h2>
        <button class="close-btn" data-close="itemModal">×</button>
      </div>
      <label>短いタイトル
        <input id="itemTitle" maxlength="30" placeholder="例：おふろに入る">
      </label>
      <label>ひとこと（なくてもOK）
        <textarea id="itemSubtitle" maxlength="60" placeholder="例：パパとママはひとやすみ。〇〇ちゃんは遊んでていいよ"></textarea>
      </label>
      <label>イラスト
        <select id="itemIcon">
          <option>☀️</option><option>🛏️</option><option>🚽</option><option>👕</option>
          <option>🍞</option><option>🚶</option><option>🎹</option><option>🍚</option>
          <option>🛝</option><option>🍜</option><option>🚗</option><option>🛁</option>
          <option>🪥</option><option>🌙</option><option>🎒</option><option>🛍️</option>
          <option>🎨</option><option>🧸</option><option>🏠</option><option>⭐</option>
        </select>
      </label>
      <label class="check-row">
        <input id="saveAsFavorite" type="checkbox">
        よく使う予定に登録する
      </label>
      <button id="saveItemBtn" class="primary-btn wide">保存</button>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2>設定</h2>
        <button class="close-btn" data-close="settingsModal">×</button>
      </div>
      <label>お子さんの名前
        <input id="childNameInput" maxlength="12" placeholder="〇〇">
      </label>
      <button id="saveNameBtn" class="primary-btn wide">名前を保存</button>
      <hr>
      <h3>いつもの予定</h3>
      <div class="template-actions">
        <button id="saveTemplateBtn" class="secondary-btn">今の予定を「いつもの予定」に保存</button>
        <button id="loadTemplateBtn" class="secondary-btn">いつもの予定を今日に読み込む</button>
        <button id="yesterdayBtn" class="secondary-btn">昨日の予定を今日にコピー</button>
      </div>
      <p class="small-note">このMVPは端末内だけに保存します。パパとママの端末は別々です。</p>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="confirm-card">
      <div class="confirm-emoji">👏</div>
      <h2>おわった？</h2>
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button id="cancelFinishBtn" class="secondary-btn">まだだよ</button>
        <button id="confirmFinishBtn" class="primary-btn">おわった</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
